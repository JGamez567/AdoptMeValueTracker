name: Scrape AMVGG values

on:
  schedule:
    # Every 12 hours. AMVGG shows "15 hours ago" style timestamps, so they
    # don't update more often than that — anything faster is wasted runs.
    - cron: "0 */12 * * *"
  workflow_dispatch: {} # lets you trigger it by hand from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # node 22, NOT 20: supabase-js wants native WebSocket, which node 20
      # doesn't have. Same reason scrape_demand.yml pins 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci || npm install

      # Explicit Chrome install. Do NOT use `npx puppeteer browsers install` —
      # it hits "Permission denied" when node_modules was committed from
      # Windows. Same fix as scrape_demand.yml.
      - name: Install Chrome for Puppeteer
        run: node node_modules/puppeteer/install.mjs

      - name: Scrape AMVGG values
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scrape_amvgg_values.js